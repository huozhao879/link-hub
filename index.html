<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<title>Huo Zhao • Official Links</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff}
body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:
radial-gradient(circle at 50% 0%,#34245f 0,transparent 38%),
radial-gradient(circle at 0% 100%,#102f48 0,transparent 35%),
linear-gradient(145deg,#05060d,#0b0a16 52%,#04050a)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.orb{position:fixed;width:230px;height:230px;border-radius:50%;filter:blur(70px);opacity:.2;pointer-events:none}
.o1{background:#8058d8;top:-90px;left:-100px;animation:drift 9s ease-in-out infinite}
.o2{background:#2c91bd;right:-100px;bottom:-90px;animation:drift 12s ease-in-out infinite reverse}
.wrap{width:min(100%,570px);padding:18px;position:relative;z-index:2}
.card{position:relative;padding:26px 18px 20px;border:1px solid #ffffff18;border-radius:30px;
background:linear-gradient(180deg,#17162bd9,#070914dc);backdrop-filter:blur(18px);
box-shadow:0 28px 90px #0009,inset 0 1px #ffffff10;overflow:hidden;animation:in .8s ease both}
.card:after{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
background:linear-gradient(115deg,transparent 15%,#c3a7ff22,transparent 55%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite}
.hero{text-align:center;position:relative}
.emblem{height:120px;display:grid;place-items:center;position:relative}
.ring{position:absolute;width:106px;height:106px;border:1px solid #cbb7ff38;border-radius:50%;box-shadow:0 0 45px #9770ff25;animation:spin 16s linear infinite}
.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;inset:10px;border:1px dashed #d5c6ff2b}
.ring:after{inset:25px;border-style:solid;border-color:#ffffff18;animation:spinr 9s linear infinite}
.dragon{font-family:serif;font-size:57px;font-weight:700;background:linear-gradient(#fff,#c2a6ff,#6d51bb);
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #a47bff66);animation:float 3.4s ease-in-out infinite}
.avatar{width:55px;height:55px;margin:-3px auto 10px;border-radius:17px;display:grid;place-items:center;font-weight:800;
letter-spacing:.08em;background:linear-gradient(145deg,#a486ff,#4a3889);border:1px solid #ffffff2b;box-shadow:0 10px 30px #6046b64d}
h1{font-size:29px;margin:0}.sub{margin:5px 0 0;color:#c9bdf0;font-size:12px;text-transform:uppercase;letter-spacing:.23em}
.desc{margin:11px auto 23px;max-width:390px;color:#aaa8ba;font-size:13px;line-height:1.55}
.links{display:grid;gap:11px}.link{min-height:72px;display:flex;align-items:center;gap:13px;padding:10px 14px;
border:1px solid #ffffff12;border-radius:19px;background:#ffffff08;color:#fff;text-decoration:none;position:relative;overflow:hidden;
transition:.22s ease}.link:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#ffffff10,transparent 48%);transform:translateX(-110%);transition:.5s}
.link:hover{transform:translateY(-3px) scale(1.01);border-color:#c6adff55;background:#ffffff0d;box-shadow:0 14px 35px #0005}
.link:hover:before{transform:translateX(110%)}.link:active{transform:scale(.95);transition:.06s}
.icon{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;background:#ffffff0e}
.y .icon{background:#ff47471c}.t .icon{background:#4de0d01a}.w .icon{background:#4dde821a}
.txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}.txt strong{font-size:15px}.txt small{font-size:11px;color:#9d9bab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:#aaa4b6;font-size:20px}.link:hover .arrow{color:#fff;transform:translate(3px,-3px)}
.note{text-align:center;margin:16px 0 0;color:#6f6d7d;font-size:10px}
.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none}.p{position:absolute;width:3px;height:3px;border-radius:50%;background:#d8caff88;animation:rise linear infinite}
.ripple{position:fixed;width:8px;height:8px;border:1px solid #d9caffaa;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9;animation:rip .65s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}@keyframes drift{50%{transform:translate(28px,-22px) scale(1.12)}}
@keyframes shine{0%,65%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
@keyframes rise{from{transform:translateY(110vh);opacity:0}15%{opacity:.7}to{transform:translateY(-10vh);opacity:0}}
@keyframes rip{to{width:250px;height:250px;opacity:0}}
@media(max-width:420px){.wrap{padding:12px}.card{padding:23px 14px 18px}.emblem{height:105px}.ring{width:92px;height:92px}.dragon{font-size:50px}h1{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="particles"></div>
<main class="wrap"><section class="card">
  <div class="hero">
    <div class="emblem"><div class="ring"></div><div class="dragon">龍</div></div>
    <div class="avatar">HZ</div>
    <h1>Huo Zhao</h1>
    <div class="sub">Official Links</div>
    <p class="desc">Ikuti semua kanal resmi Huo Zhao melalui tombol di bawah.</p>
  </div>
  <nav class="links" aria-label="Link resmi">
    <a class="link y" href="https://www.youtube.com/@huozhao1" target="_blank" rel="noopener">
      <span class="icon">▶</span><span class="txt"><strong>YouTube</strong><small>@huozhao1</small></span><span class="arrow">↗</span>
    </a>
    <a class="link t" href="https://www.tiktok.com/@huozhao5?_r=1&_t=ZS-99hxea0r8NA" target="_blank" rel="noopener">
      <span class="icon">♪</span><span class="txt"><strong>TikTok</strong><small>@huozhao5</small></span><span class="arrow">↗</span>
    </a>
    <a class="link w" href="https://whatsapp.com/channel/0029Vb5dhRcJ93weFEQ1Tm3z" target="_blank" rel="noopener">
      <span class="icon">◉</span><span class="txt"><strong>Saluran WhatsApp</strong><small>Gabung ke saluran WhatsApp</small></span><span class="arrow">↗</span>
    </a>
  </nav>
  <div class="note">Tekan tombol untuk membuka kanal resmi</div>
</section></main>
<div id="ripples"></div>
<script>
const box=document.querySelector('.particles');
for(let i=0;i<28;i++){let p=document.createElement('i');p.className='p';p.style.left=Math.random()*100+'%';p.style.animationDuration=6+Math.random()*9+'s';p.style.animationDelay=-Math.random()*12+'s';box.appendChild(p)}
document.querySelectorAll('.link').forEach(a=>a.addEventListener('click',e=>{let r=document.createElement('i');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),700)}));
</script>
</body>
</html>
